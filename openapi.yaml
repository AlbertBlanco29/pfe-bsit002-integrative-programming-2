openapi: 3.0.3

info:
  title: Employee Management API
  description: REST API for managing employees
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8000/api/v1

paths:

  /employees:
    get:
      summary: Get all employees
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: department_id
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Employees retrieved successfully

    post:
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '201':
          description: Employee created successfully
        '422':
          description: Validation error

  /employees/{id}:
    get:
      summary: Get one employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Employee retrieved successfully
        '404':
          description: Employee not found

    put:
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '200':
          description: Employee updated successfully
        '404':
          description: Employee not found
        '422':
          description: Validation error

    delete:
      summary: Delete an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Employee deleted successfully
        '404':
          description: Employee not found

components:

  schemas:

    EmployeeRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - department_id
        - position
      properties:
        first_name:
          type: string
          example: Juan
        last_name:
          type: string
          example: Dela Cruz
        email:
          type: string
          format: email
          example: juan@example.com
        department_id:
          type: integer
          example: 1
        position:
          type: string
          example: Programmer

    Employee:
      type: object
      properties:
        id:
          type: integer
          example: 1
        first_name:
          type: string
          example: Juan
        last_name:
          type: string
          example: Dela Cruz
        email:
          type: string
          format: email
          example: juan@example.com
        department_id:
          type: integer
          example: 1
        department:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: IT
        position:
          type: string
          example: Programmer
        created_at:
          type: string
          format: date-time
          example: 2026-08-04T10:00:00Z