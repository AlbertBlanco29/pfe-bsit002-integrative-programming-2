openapi: 3.0.3

info:
  title: Employee Management API
  description: API for managing employees and departments.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local Laravel Server

paths:

  /employees:
    get:
      summary: View all employees
      description: Returns a list of all employees.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search employee by name.
        - name: department
          in: query
          required: false
          schema:
            type: string
          description: Filter employees by department.
      responses:
        '200':
          description: Employees retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'

    post:
      summary: Add an employee
      description: Creates a new employee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '201':
          description: Employee created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '422':
          description: Validation error.

  /employees/{id}:
    get:
      summary: View one employee
      description: Returns one employee by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Employee retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '404':
          description: Employee not found.

    put:
      summary: Update employee information
      description: Updates an existing employee.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '200':
          description: Employee updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '404':
          description: Employee not found.
        '422':
          description: Validation error.

    delete:
      summary: Delete an employee
      description: Deletes an employee by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Employee deleted successfully.
        '404':
          description: Employee not found.

components:

  schemas:

    Employee:
      type: object
      properties:
        id:
          type: integer
          example: 1
        first_name:
          type: string
          example: Juan
        last_name:
          type: string
          example: Dela Cruz
        email:
          type: string
          format: email
          example: juan@example.com
        department:
          type: string
          example: IT
        position:
          type: string
          example: Programmer
        created_at:
          type: string
          format: date-time
          example: 2026-08-04T10:00:00Z

    EmployeeRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - department
        - position
      properties:
        first_name:
          type: string
          example: Juan
        last_name:
          type: string
          example: Dela Cruz
        email:
          type: string
          format: email
          example: juan@example.com
        department:
          type: string
          example: IT
        position:
          type: string
          example: Programmer